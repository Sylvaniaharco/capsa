<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sumber ikon Capsa Kung2: susunan Capsa 6 kartu 1-2-3 (A♥ / A♣ A♦ / A♠ K♠ Q♠) + tulisan emas gaya Mahjong Kung2.
       PNG dibuat dengan scripts/icons.cjs (butuh Playwright + font Cinzel dari Google Fonts; jalankan kalau desain berubah). -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="72%"><stop offset="0" stop-color="#2aa585"/><stop offset=".55" stop-color="#0f5a47"/><stop offset="1" stop-color="#062b22"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe69a" stop-opacity=".55"/><stop offset="1" stop-color="#ffe69a" stop-opacity="0"/></radialGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffef8"/><stop offset="1" stop-color="#efe4c8"/></linearGradient>
    <linearGradient id="goldtxt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbd0"/><stop offset=".42" stop-color="#ffd54a"/><stop offset=".75" stop-color="#f3a51b"/><stop offset="1" stop-color="#c76a0a"/></linearGradient>
    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d27a"/><stop offset=".5" stop-color="#c8902c"/><stop offset="1" stop-color="#8a5a14"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".55"/></filter>
    <g id="card">
      <rect x="-52" y="-73" width="104" height="146" rx="12" fill="#000" opacity=".35" transform="translate(3 6)"/>
      <rect x="-52" y="-73" width="104" height="146" rx="12" fill="url(#ivory)" stroke="#b9a777" stroke-width="2"/>
    </g>
    <g id="court"><rect x="-40" y="-38" width="80" height="102" rx="7" fill="none" stroke="url(#goldline)" stroke-width="3"/></g>
    <path id="spade" d="M12 1.5C8.5 6.5 2.5 9.3 2.5 14.2a4.7 4.7 0 0 0 8.3 3c-.3 2-1.1 3.8-2.3 5.3h7c-1.2-1.5-2-3.3-2.3-5.3a4.7 4.7 0 0 0 8.3-3C21.5 9.3 15.5 6.5 12 1.5Z"/>
    <path id="heart" d="M12 22C5.2 16.3 2 12.3 2 8.2A5.3 5.3 0 0 1 12 5.8 5.3 5.3 0 0 1 22 8.2C22 12.3 18.8 16.3 12 22Z"/>
    <path id="diamond" d="M12 1.5 20 12 12 22.5 4 12Z"/>
    <g id="club"><circle cx="12" cy="6.6" r="4.7"/><circle cx="6.4" cy="13.6" r="4.7"/><circle cx="17.6" cy="13.6" r="4.7"/><path d="M12 10 9 22.5h6Z"/></g>
  </defs>
  <g id="art">
    <ellipse cx="256" cy="200" rx="230" ry="190" fill="url(#glow)"/>
    <!-- baris 1: A hati -->
    <g transform="translate(256 101)">
      <use href="#card"/>
      <text x="-44" y="-40" font-family="Cinzel, Georgia, serif" font-weight="900" font-size="32" fill="#cf1f2c">A</text>
      <use href="#heart" fill="#cf1f2c" transform="translate(-45 -34) scale(.9)"/>
      <use href="#heart" fill="#cf1f2c" transform="translate(-16 -36) scale(1.75)"/>
    </g>
    <!-- baris 2: A keriting + A wajik -->
    <g transform="translate(198 191) rotate(-5)">
      <use href="#card"/>
      <text x="-44" y="-40" font-family="Cinzel, Georgia, serif" font-weight="900" font-size="32" fill="#18212b">A</text>
      <use href="#club" fill="#18212b" transform="translate(-45 -34) scale(.9)"/>
      <use href="#club" fill="#18212b" transform="translate(-16 -36) scale(1.75)"/>
    </g>
    <g transform="translate(314 191) rotate(5)">
      <use href="#card"/>
      <text x="-44" y="-40" font-family="Cinzel, Georgia, serif" font-weight="900" font-size="32" fill="#cf1f2c">A</text>
      <use href="#diamond" fill="#cf1f2c" transform="translate(-45 -34) scale(.9)"/>
      <use href="#diamond" fill="#cf1f2c" transform="translate(-16 -36) scale(1.75)"/>
    </g>
    <!-- baris 3: A K Q sekop -->
    <g transform="translate(142 283) rotate(-8)">
      <use href="#card"/>
      <text x="-44" y="-40" font-family="Cinzel, Georgia, serif" font-weight="900" font-size="32" fill="#18212b">A</text>
      <use href="#spade" fill="#18212b" transform="translate(-45 -34) scale(.9)"/>
      <use href="#spade" fill="#18212b" transform="translate(-16 -36) scale(1.75)"/>
    </g>
    <g transform="translate(370 283) rotate(8)">
      <use href="#card"/><use href="#court"/>
      <text x="-44" y="-40" font-family="Cinzel, Georgia, serif" font-weight="900" font-size="32" fill="#18212b">Q</text>
      <use href="#spade" fill="#18212b" transform="translate(-45 -34) scale(.9)"/>
      <text x="2" y="10" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="900" font-size="56" fill="#18212b">Q</text>
      <use href="#spade" fill="#18212b" transform="translate(-9 44) scale(.75)"/>
    </g>
    <g transform="translate(256 279)">
      <use href="#card"/><use href="#court"/>
      <text x="-44" y="-40" font-family="Cinzel, Georgia, serif" font-weight="900" font-size="32" fill="#18212b">K</text>
      <use href="#spade" fill="#18212b" transform="translate(-45 -34) scale(.9)"/>
      <text x="2" y="10" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="900" font-size="56" fill="#18212b">K</text>
      <use href="#spade" fill="#18212b" transform="translate(-9 44) scale(.75)"/>
    </g>
    <!-- tulisan emas (gaya logo Mahjong Kung2) -->
    <g font-family="Cinzel, Georgia, serif" font-weight="900" text-anchor="middle" filter="url(#drop)">
      <text x="256" y="424" font-size="92" letter-spacing="2" fill="url(#goldtxt)" stroke="#4a1405" stroke-width="12" stroke-linejoin="round" paint-order="stroke">CAPSA</text>
      <text x="256" y="480" font-size="58" letter-spacing="3" fill="url(#goldtxt)" stroke="#4a1405" stroke-width="10" stroke-linejoin="round" paint-order="stroke">KUNG2</text>
    </g>
  </g>
</svg>
