<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sumber ikon "Capsa Susun Kung2" (gaya sama dengan ikon Mahjong Kung2: bingkai emas, kartu besar, tulisan emas di bawah).
       PNG dibuat dengan scripts/icons.cjs (butuh Playwright; jalankan kalau desain berubah). -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="72%"><stop offset="0" stop-color="#2f9e82"/><stop offset=".55" stop-color="#12634f"/><stop offset="1" stop-color="#062c23"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".75"/><stop offset=".5" stop-color="#ffd25a" stop-opacity=".28"/><stop offset="1" stop-color="#ffd25a" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".35" stop-color="#e8b43c"/><stop offset=".7" stop-color="#b87514"/><stop offset="1" stop-color="#f6d56a"/></linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffefa"/><stop offset=".6" stop-color="#f6ecd2"/><stop offset="1" stop-color="#e0d1a8"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6b8"/><stop offset=".42" stop-color="#ffd23e"/><stop offset=".62" stop-color="#f0a010"/><stop offset="1" stop-color="#c8630a"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc062"/><stop offset=".5" stop-color="#f4701f"/><stop offset="1" stop-color="#c2310f"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3a52"/><stop offset="1" stop-color="#0d131c"/></linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ee3a45"/><stop offset="1" stop-color="#b3111e"/></linearGradient>
    <g id="card">
      <rect x="-80" y="-112" width="160" height="224" rx="17" fill="#000" opacity=".33" transform="translate(5 9)"/>
      <rect x="-80" y="-112" width="160" height="224" rx="17" fill="url(#ivory)" stroke="#a98e4e" stroke-width="3"/>
      <rect x="-76" y="-108" width="152" height="112" rx="14" fill="url(#gloss)" opacity=".8"/>
    </g>
    <path id="spade" d="M12 1.5C8.5 6.5 2.5 9.3 2.5 14.2a4.7 4.7 0 0 0 8.3 3c-.300 2-1.1 3.8-2.3 5.300h7c-1.2-1.5-2-3.3-2.3-5.300a4.7 4.7 0 0 0 8.3-3C21.5 9.3 15.5 6.5 12 1.500Z"/>
    <path id="heart" d="M12 22C5.2 16.3 2 12.3 2 8.200A5.3 5.3 0 0 1 12 5.8 5.3 5.3 0 0 1 22 8.200C22 12.3 18.8 16.3 12 22Z"/>
    <path id="diamond" d="M12 1.5 20 12 12 22.5 4 12Z"/>
    <path id="spark" d="M0-1 .22-.22 1 0 .22.22 0 1-.22.22-1 0-.22-.22Z"/>
  </defs>

  <!-- bingkai: emas di luar, meja kartu hijau di dalam -->
  <g id="frame">
    <rect width="512" height="512" rx="108" fill="url(#rim)"/>
    <rect x="9" y="9" width="494" height="494" rx="99" fill="#7a4a0c"/>
    <rect x="13" y="13" width="486" height="486" rx="95" fill="url(#rim)"/>
    <rect x="21" y="21" width="470" height="470" rx="88" fill="url(#felt)"/>
    <rect x="21" y="21" width="470" height="470" rx="88" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="3"/>
  </g>

  <g id="art">
    <circle cx="256" cy="205" r="215" fill="url(#glow)"/>

    <!-- kipas tiga kartu -->
    <g transform="translate(256 212) rotate(-23 0 190)">
      <use href="#card"/>
      <text x="-62" y="-50" font-family="Montserrat, Arial, Helvetica, sans-serif" font-weight="800" font-size="60" fill="url(#ruby)">A</text>
      <use href="#diamond" fill="url(#ruby)" transform="translate(-62 -42) scale(1.7)"/>
    </g>
    <g transform="translate(256 212) rotate(23 0 190)">
      <use href="#card"/>
      <text x="-62" y="-50" font-family="Montserrat, Arial, Helvetica, sans-serif" font-weight="800" font-size="60" fill="url(#ruby)">A</text>
      <use href="#heart" fill="url(#ruby)" transform="translate(-62 -42) scale(1.7)"/>
      <use href="#heart" fill="url(#ruby)" transform="translate(-4 12) scale(3.3)"/>
    </g>
    <g transform="translate(256 200) scale(1.04)">
      <use href="#card"/>
      <text x="-62" y="-50" font-family="Montserrat, Arial, Helvetica, sans-serif" font-weight="800" font-size="60" fill="url(#ink)">A</text>
      <use href="#spade" fill="url(#ink)" transform="translate(-62 -42) scale(1.7)"/>
      <use href="#spade" fill="url(#ink)" transform="translate(-28 -10) scale(4.3)"/>
      <path d="M-14 38c8-14 22-20 34-24" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3.500" stroke-linecap="round"/>
    </g>

    <!-- kilau emas -->
    <g fill="#fff3b0">
      <use href="#spark" transform="translate(96 96) scale(15)"/>
      <use href="#spark" transform="translate(430 150) scale(11)"/>
      <use href="#spark" transform="translate(410 300) scale(8)"/>
      <use href="#spark" transform="translate(78 270) scale(9)"/>
      <use href="#spark" transform="translate(352 58) scale(7)"/>
    </g>

    <!-- tulisan -->
    <g font-family="Poppins, 'Arial Black', Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle" stroke-linejoin="round">
      <g id="t1">
        <text x="256" y="417" font-size="100" textLength="372" lengthAdjust="spacingAndGlyphs" fill="#3a0f02" stroke="#3a0f02" stroke-width="16" transform="translate(0 6)">CAPSA</text>
        <text x="256" y="417" font-size="100" textLength="372" lengthAdjust="spacingAndGlyphs" fill="#7a2a08" stroke="#7a2a08" stroke-width="13">CAPSA</text>
        <text x="256" y="417" font-size="100" textLength="372" lengthAdjust="spacingAndGlyphs" fill="url(#gold)" stroke="#fff2a8" stroke-width="1.500">CAPSA</text>
      </g>
      <g id="t2">
        <text x="256" y="476" font-size="56" textLength="388" lengthAdjust="spacingAndGlyphs" fill="#3a0f02" stroke="#3a0f02" stroke-width="12" transform="translate(0 4)">SUSUN KUNG2</text>
        <text x="256" y="476" font-size="56" textLength="388" lengthAdjust="spacingAndGlyphs" fill="#7a1f06" stroke="#7a1f06" stroke-width="10">SUSUN KUNG2</text>
        <text x="256" y="476" font-size="56" textLength="388" lengthAdjust="spacingAndGlyphs" fill="url(#orange)" stroke="#ffd9a0" stroke-width="1.200">SUSUN KUNG2</text>
      </g>
    </g>
  </g>
</svg>
